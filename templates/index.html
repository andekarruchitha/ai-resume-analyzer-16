<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Analyzer</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 70%;
            margin: auto;
        }

        h1{
            color: darkblue;
        }

        button{
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        .score{
            color: green;
            font-size: 25px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Resume Analyzer</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" required>

        <button type="submit">Upload Resume</button>

    </form>

    <hr>

    <h2 class="score">
        Resume Score: {{ score }}/100
    </h2>

    <h2>Suggestions:</h2>

    <ul>
        {% for item in suggestions %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>

    <h2>Resume Text:</h2>

    <p>{{ text }}</p>

</div>

</body>

</html>
